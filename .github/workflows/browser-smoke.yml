name: PlotCloud browser smoke
on:
  push:
    branches: [main, fix/professional-release-copy, fix/simplify-navigation-home]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify render service and comparison contracts
        run: node --test server/render-api.test.mjs tests/render-compare.cjs
      - name: Serve site and run browser smoke
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/plotcloud-http.log 2>&1 &
          node tests/run-browser-check.cjs tests/ui-unification.cjs
          node tests/run-browser-check.cjs tests/acoustics.cjs
          node tests/run-browser-check.cjs tests/home-hero.cjs
          node tests/run-browser-check.cjs tests/sun-period.cjs
          node tests/run-browser-check.cjs tests/simulation-fit.cjs
          node tests/run-browser-check.cjs tests/exterior-layout.cjs
          node tests/run-browser-check.cjs hero/toronto.test.cjs
          node tests/run-browser-check.cjs tests/views.cjs
          node tests/run-browser-check.cjs tests/compare-2d.cjs
          node tests/run-browser-check.cjs tests/workflow.cjs
          node tests/run-browser-check.cjs tests/shell.cjs
          node tests/run-browser-check.cjs tests/smoke.cjs
      - name: Save responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plotcloud-responsive-screenshots
          path: /tmp/plotcloud-screenshots
          if-no-files-found: ignore
