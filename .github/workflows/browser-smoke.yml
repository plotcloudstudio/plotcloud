name: PlotCloud browser smoke
on:
  push:
    branches: [main, fix/professional-release-copy, fix/simplify-navigation-home]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - group: core
            scripts: >-
              tests/ui-unification.cjs tests/acoustics.cjs tests/home-hero.cjs tests/sun-period.cjs
          - group: layout
            scripts: >-
              tests/simulation-fit.cjs tests/unified-simulation-audit.cjs tests/unified-results.cjs tests/selected-layouts.cjs
          - group: study
            scripts: >-
              tests/simulation-header.cjs tests/short-simulation-window.cjs tests/simulation-startup.cjs tests/simulation-art.cjs
          - group: climate
            scripts: >-
              tests/shared-conditions.cjs tests/project-climate.cjs tests/climate-studies.cjs tests/charts-list.cjs tests/exterior-layout.cjs
          - group: presentation
            scripts: >-
              hero/toronto.test.cjs tests/resources-native.cjs tests/compare-2d.cjs tests/workflow.cjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify service and shared selection contracts
        run: node --test server/render-api.test.mjs tests/studio-tab.cjs
      - name: Serve site and run browser smoke
        env:
          TEST_BASE: http://127.0.0.1:8765
          CHECK_SCRIPTS: ${{ matrix.scripts }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/plotcloud-http.log 2>&1 &
          for check in $CHECK_SCRIPTS; do node tests/run-browser-check.cjs "$check" || exit $?; done
      - name: Save responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plotcloud-responsive-screenshots-${{ matrix.group }}
          path: /tmp/plotcloud-screenshots
          if-no-files-found: ignore
