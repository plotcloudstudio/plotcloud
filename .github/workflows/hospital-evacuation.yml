name: Hospital evacuation verification
on:
  push:
    branches: [main]
    paths:
      - 'mvp/js/interior/egress.js'
      - 'tests/egress-engine.test.mjs'
      - '.github/workflows/hospital-evacuation.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/egress-engine.test.mjs
