name: Hospital evacuation verification
on:
  push:
    branches: [main]
    paths:
      - 'mvp/js/egress/**'
      - 'mvp/js/pages/fire-evacuation.js'
      - 'mvp/research/**'
      - 'tests/*egress*'
      - 'tests/*evacuation*'
      - 'tests/hospital-research-experiment.mjs'
      - '.github/workflows/hospital-evacuation.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/fire-evacuation.test.mjs
      - run: node tests/hospital-research-experiment.mjs --check
