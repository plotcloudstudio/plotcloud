name: Simulation entries and cover resources
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/simulation-entry-resources]
  workflow_dispatch:
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Check every catalog entry and image, then Workspace handoff
        env:
          TEST_BASE: http://127.0.0.1:8765
          SHOT_DIR: /tmp/simulation-entry-resources
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/simulation-entry-http.log 2>&1 &
          node tests/run-browser-check.cjs tests/simulation-entry-resources.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-entry-resources
          path: /tmp/simulation-entry-resources
          if-no-files-found: ignore
