name: Workbench handoff and light appearance
on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/simulation-handoff-review]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify stored contracts and fixed light palette
        run: |
          node tests/handoff-contract.cjs
          node tests/light-appearance.cjs
          node tests/study-evidence.cjs
      - name: Exercise actual study handoff and regression workflows
        env:
          TEST_BASE: http://127.0.0.1:8790
          LAPTOP_STUDIES: sunhours,daylight,vent,structure
        run: |
          python3 -m http.server 8790 --bind 127.0.0.1 > /tmp/handoff-http.log 2>&1 &
          node tests/handoff-ui.cjs
          node tests/laptop-layout.cjs
          node tests/workbench-editing.cjs
          node tests/shared-conditions.cjs
