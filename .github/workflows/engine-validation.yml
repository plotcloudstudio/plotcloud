name: PlotCloud engine validation
on:
  push:
    branches: [main]
    paths: ['emb/sunhours.html', 'emb/daylight.html', 'emb/noise.html', 'emb/roomacoustics.html', 'emb/lib/plansim.js', 'tests/validation/**', '.github/workflows/engine-validation.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install references and browser
        run: |
          pip install numpy pandas pvlib pyradiance
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve the site and validate the engines
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/http.log 2>&1 &
          sleep 1
          tests/validation/run_all.sh
      - name: Keep the measured errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-validation-results
          path: tests/validation/*.json
