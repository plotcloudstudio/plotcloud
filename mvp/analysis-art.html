<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden;font-family:Arial,sans-serif}canvas{display:block}.head,.foot{position:absolute;left:44px;right:44px;display:flex;justify-content:space-between;z-index:2}.head{top:34px;font-size:17px;font-weight:600}.foot{bottom:28px;font-size:11px;letter-spacing:1px}.bar{width:150px;height:6px;display:inline-block;margin-left:12px;vertical-align:middle;background:linear-gradient(90deg,var(--low),var(--high))}</style></head><body><div class="head"><span id="name"></span><span style="font-size:11px;letter-spacing:1px;opacity:.55">PLOTCLOUD / ANALYSIS</span></div><div class="foot"><span>ILLUSTRATIVE PREVIEW · SAME MODEL / SAME VIEW</span><span id="legend"></span></div><script type="module">
import * as T from '../furniture/three.module.min.js';
import {sampleModel,SIMS} from './js/data.js';
const q=new URLSearchParams(location.search),id=q.get('mode')||'daylight',night=q.get('t')==='night',sim=SIMS.find(s=>s.id===id),W=1200,H=900;
const palettes={sunhours:['#4454a4','#f4ce4a'],daylight:['#5163b2','#f5da67'],wind:['#256ba6','#ee6344'],vent:['#538ec2','#edb95b'],stormwater:['#d7e7eb','#286ebb'],acoustics:['#6bb98e','#f49b40'],spacesyntax:['#6395bf','#e96c75'],movementdepth:['#8db7d5','#ef9aa6'],evac:['#9990bb','#e05990'],isovist:['#d6d9dc','#f5a83f'],views:['#cddbcf','#69ad8c'],cameras:['#d1dce9','#568dc5'],structure:['#4f83bf','#e55b49'],span:['#97a7b7','#d6944f']};
const [low,high]=palettes[id];document.body.style.cssText=`color:${night?'#eeeae4':'#333c48'};--low:${low};--high:${high}`;document.querySelector('#name').textContent=sim.name;document.querySelector('#legend').innerHTML='LOW <i class="bar"></i> HIGH';if(['evac','cameras','span','isovist'].includes(id))document.querySelector('#legend').textContent={evac:'MOVEMENT PATHS',cameras:'COVERAGE CONES',span:'SPAN & MEMBER DEPTH',isovist:'VISIBLE / OCCLUDED'}[id];
const r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(W,H);r.setPixelRatio(1);r.outputColorSpace=T.SRGBColorSpace;document.body.prepend(r.domElement);
const scene=new T.Scene();scene.background=new T.Color(night?'#161c25':'#f1f2f4');scene.add(new T.HemisphereLight(0xffffff,0x96a3b2,2));const sun=new T.DirectionalLight(0xffffff,2.4);sun.position.set(-8,-12,25);scene.add(sun);
const model=sampleModel('A'),group=new T.Group();scene.add(group);const gbox=new T.BoxGeometry(1,1,1);
const mesh=(x,y,z,w,d,h,color,opacity=1)=>{const m=new T.Mesh(gbox,new T.MeshStandardMaterial({color,roughness:.95,transparent:opacity<1,opacity,depthWrite:opacity===1}));m.scale.set(w,d,h);m.position.set(x+w/2,y+d/2,z+h/2);group.add(m);return m;};
const path=(points,color,width=1,opacity=1)=>{const line=new T.Line(new T.BufferGeometry().setFromPoints(points.map(p=>new T.Vector3(...p))),new T.LineBasicMaterial({color,transparent:true,opacity}));group.add(line);return line;};
mesh(-.65,-.65,-.25,17.3,13.3,.25,night?'#4b5664':'#dfe3e7');
for(const c of model.components){if(!['wall','window','door','furniture'].includes(c.type))continue;const a=c.g;if(a.x>17||a.y>13)continue;const wall=c.type==='wall',glass=c.type==='window';const m=mesh(a.x,a.y,a.z,a.w,a.d,wall?Math.min(a.h,1.45):glass?Math.min(a.h,.8):Math.min(a.h,1),glass?'#9ac9de':wall?'#e2e3df':'#aab4bd',glass?.45:1);const edge=new T.LineSegments(new T.EdgesGeometry(gbox),new T.LineBasicMaterial({color:night?'#607080':'#a1a9af',transparent:true,opacity:.5}));edge.scale.copy(m.scale);edge.position.copy(m.position);group.add(edge);}
const surface=(fn)=>{for(let x=.25;x<15.75;x+=.42)for(let y=.25;y<11.75;y+=.42){const t=fn(x,y),color=new T.Color(low).lerp(new T.Color(high),Math.max(0,Math.min(1,t)));mesh(x,y,.025,.4,.4,.025,color);}};
if(['sunhours','daylight','spacesyntax','movementdepth','views','isovist','stormwater'].includes(id))surface((x,y)=>id==='daylight'||id==='sunhours'?Math.max(0,1-y/12)*(.7+.3*Math.cos(x*.55)):id==='movementdepth'?Math.floor((x+y)/4)/7:id==='stormwater'?Math.exp(-((x-10)**2+(y-7)**2)/18):id==='isovist'?(Math.atan2(y-3,x-4)>.15&&x>4?1:.08):id==='views'?Math.max(0,1-Math.min(y,12-y,x,16-x)/5):.5+.4*Math.sin(x*.3)*Math.cos(y*.2));
if(['wind','vent'].includes(id))for(let i=0;i<16;i++){const points=[];for(let j=0;j<=65;j++){const x=-.3+j*.25,y=i*.73+.25+Math.sin(x*.4+i*.15)*.2;points.push([x,y,.45+(id==='wind'?(i%3)*.14:0)]);}path(points,new T.Color(low).lerp(new T.Color(high),i/15));const [x,y,z]=points[48];path([[x-.3,y-.12,z],[x,y,z],[x-.3,y+.12,z]],high);}
if(id==='acoustics'){const source=new T.Vector3(4,5,.65);for(let i=0;i<1700;i++){const a=i*2.39996,rad=.3+((i%270)/270)*4.5,x=source.x+Math.cos(a)*rad,y=source.y+Math.sin(a)*rad;if(x<.3||x>9||y<.3||y>10)continue;mesh(x,y,.45+Math.sin(rad*3)*.18,.045,.045,.045,new T.Color(high).lerp(new T.Color(low),rad/5));}const s=new T.Mesh(new T.SphereGeometry(.16),new T.MeshBasicMaterial({color:'#ef6146'}));s.position.copy(source);group.add(s);}
if(id==='evac')for(let i=0;i<30;i++){const y=.4+i*.36;path([[.8,y,.12],[5.5,y,.12],[6,5.7,.12],[15.5,5.7+(i%4)*.045,.12]],new T.Color(low).lerp(new T.Color(high),i/30),1,.7);}
if(id==='cameras')for(const [x,y,a] of [[1,1,.4],[15,11,3.55],[8,1,1.5]]){const points=[[x,y,.12]];for(let i=0;i<=24;i++){const t=a-.65+i/24*1.3;points.push([Math.max(.2,Math.min(15.8,x+Math.cos(t)*7)),Math.max(.2,Math.min(11.8,y+Math.sin(t)*7)),.12]);}points.push([x,y,.12]);path(points,high);for(let i=0;i<9;i++){const t=a-.65+i/8*1.3;path([[x,y,.12],[Math.max(.2,Math.min(15.8,x+Math.cos(t)*7)),Math.max(.2,Math.min(11.8,y+Math.sin(t)*7)),.12]],low,1,.5);}}
if(['structure','span'].includes(id)){for(const x of [1,5.6,10.2,15]){path([[x,1,.1],[x,1,2.6],[x,11,2.6],[x,11,.1]],high);for(const y of [1,6,11]){mesh(x-.06,y-.06,0,.12,.12,2.6,low);if(id==='structure')path([[1,y,2.7],[5.6,y,2.54],[10.2,y,2.54],[15,y,2.7]],high);}}for(const y of [1,6,11])mesh(1,y-.08,2.5,14,.16,.18,high);}
const cam=new T.OrthographicCamera(-13.7,13.7,10.275,-10.275,.1,200);cam.up.set(0,0,1);cam.position.set(31,-28,30);cam.lookAt(8,6,.4);r.render(scene,cam);window.__artReady=true;
</script></body></html>
