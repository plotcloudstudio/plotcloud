/* Standalone study: the scene owns the page, independent of the PlotCloud site. */

.study-controls button{max-width:none}

.disclaimer{margin:10px 0 0}
@media(max-width:640px){.study{padding:20px 18px 16px;grid-template-rows:20px minmax(350px,1fr) 60px 64px 28px;height:100svh;min-height:650px}.viewport{height:auto}.study-controls{width:100%}.study-caption{padding-top:16px}.disclaimer{font-size:8px}}

[data-embedded=true] .study-controls{padding:3px;max-width:450px}
[data-embedded=true] .study-caption{padding-top:12px}
[data-embedded=true] .disclaimer{margin-top:8px}
[data-embedded=true][data-theme=night]{background:#111317;color:#e7e6df;color-scheme:dark;--accent:#dbb56d;--tint:#28251d}

[data-embedded=true][data-theme=night] [data-mode=rain]{--accent:#8bb4dd;--tint:#1d2937}
[data-embedded=true][data-theme=night] [data-mode=sound]{--accent:#bfa3dc;--tint:#2a2233}
[data-embedded=true][data-theme=night] .study-controls{background:#111113;border-color:#2d2d30}
[data-embedded=true][data-theme=night] .study-controls button{color:#b2b4ac}
[data-embedded=true][data-theme=night] .study-controls button[aria-pressed=true]{color:var(--accent)}
[data-embedded=true][data-theme=night] .view-actions button{background:#161618;border-color:#343439;color:#d5d6cf}
[data-embedded=true][data-theme=night] .topline,[data-embedded=true][data-theme=night] .view-hint,[data-embedded=true][data-theme=night] .study-caption span,[data-embedded=true][data-theme=night] .disclaimer{color:#a5a79e}

[data-embedded=true] .study{display:block;padding:0;min-height:0;height:100svh;overflow:hidden}
